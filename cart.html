<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Farid Express - Shopping Cart</title>
    <link rel="stylesheet" href="sourch/style.css">
    <link rel="icon" href="./images/logo.jpg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="navbar-top-row">
        <a href="index.html">
            <h2>Farid Express</h2>
        </a>

        <div class="search-bar-integrated">
            <input type="text" id="searchInput" placeholder="Search products, brands, OEMs..." autocomplete="off">
            <button id="searchButton"><i class="bi bi-search"></i></button>
        </div>

        <a href="cart.html">
            <div class="CART">
                <i class="bi bi-cart2"></i>
                <div class="cartAmount" id="cartAmount">0</div>
            </div>
        </a>
    </div>

     <main class="cart-page-layout">
        <div class="cart-items-section">
            <div id="label" class="cart-header">
            </div>
            <div id="shopping-cart" class="shopping-cart-container">
            </div>        
        </div>

        <div id="summary-section" class="summary-section"></div>
        
     </main>
    <script src="sourch/data.js"></script>
    <script src="sourch/cart.js"></script>
    <script src="sourch/checkout.js"></script>
</body>
</html>
