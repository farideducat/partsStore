<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Farid Express</title>
  <link rel="stylesheet" href="sourch/admin.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

  <div class="admin-container">
    <h2>📦 Admin Panel/ sell your product here</h2>

    <!-- Product Form -->
    <form id="productForm" class="product-form">
      <input type="text" id="name" placeholder="Product Name" required>
      <input type="number" id="price" placeholder="Price (OMR)" step="0.01" required>
      <input type="text" id="category" placeholder="Category" required>
      <input type="text" id="image" placeholder="Image URL" required>
      <textarea id="description" placeholder="Product Description"></textarea>
      <button type="submit">Add Product</button>
    </form>

    <h3>All Products</h3>
    <div id="productList" class="product-list">
      <!-- Products will load here -->
    </div>
  </div>

<script src="sourch/admin.js"></script>

</body>
</html>
