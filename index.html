<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="sourch/style.css">
    <link rel="icon" href="./images/logo.jpg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
   <div class="navbar">
    <a href="index.html">
     <h2>PARTS STORE (developing by farid 2025) (work on progress)</h2>
    </a>


        <a href="cart.html">
        <div class="CART">
             <i class="bi bi-cart2"></i>
            <div class="cartAmount" id="cartAmount">0</div>
        </div>
        </a>
        
    </div> 

    <div id="shop" class="shop">

        
    </div>
 
     <section class="contact">
         <h3>Contact Me!</h3>

           <form id="form" action="#">

            <div class="input-box">

                 <div class="input-field field">
                 <input type="text" placeholder="Full name" id="name" name="form_name" class="item" autocomplete="off">
                 <div class="tex-error">Name Can't be blank</div>
                </div>

                <div class="input-field field">
                 <input type="text" placeholder="Email Address" id="email" name="form_email" class="item" autocomplete="off">
                  <div class="tex-error">Email Can't be blank</div>
                </div>

               </div>


            <div class="input-box">

                 <div class="input-field field">
                  <input type="text" placeholder="Phone Number" id="phone" name="form_phone" class="item" autocomplete="off">
                   <div class="tex-error">Phone Number Can't be blank</div>
              </div>

                <div class="input-field field">
                   <input type="text" placeholder=" Plesase Describe the Subject" id="subject" name="subject" class="item" autocomplete="off">
                    <div class="tex-error">Subject Can't be blank</div>
                </div>
             </div>

              <div class="textarea-field field">
               <textarea  placeholder="Your message" 
               id="message" name="message" class="item" cols="30" rows="10" autocomplete="off"></textarea>
                <div class="tex-error">Message Can't be blank</div>
              </div>

              <button type="submit">Send Message</button>
           </form>

      </section>
  

</body>
  <script src="sourch/data.js"></script>
  <script src="sourch/main.js"></script>

  <script  src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
</script>

</html>
